<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF7EE">
<title>Charla · Inglés conversacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="brand" aria-label="Charla, ir al inicio">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 8h22a6 6 0 0 1 6 6v9a6 6 0 0 1-6 6H16l-7 6v-6H6a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="#FF6B4A"/><path d="M11 18q3-4 6 0t6 0t6 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <span>Charla</span>
  </button>
  <nav id="nav" hidden aria-label="Secciones">
    <button data-go="plan"><span class="ni">🏠</span><span class="nt">Plan</span></button>
    <button data-go="lessons"><span class="ni">🎬</span><span class="nt">Lecciones</span></button>
    <button data-go="practice"><span class="ni">🎙️</span><span class="nt">Pronunciación</span></button>
    <button data-go="free"><span class="ni">💬</span><span class="nt">Conversar</span></button>
    <button data-go="progress"><span class="ni">📈</span><span class="nt">Progreso</span></button>
  </nav>
  <button id="btnSettings" aria-label="Ajustes">⚙️</button>
</header>

<main class="layout">
  <section class="stage" aria-label="Tutor virtual">
    <div class="scene" id="scene"></div>
    <div class="npc" id="npc" hidden><span class="npc-ava"></span><span class="npc-name"></span></div>
    <div class="char-wrap" id="charWrap"></div>
    <div class="bubble" id="bubble" hidden aria-live="polite"><div class="bubble-who"></div><div class="bubble-text"></div></div>
    <div class="vctl" role="toolbar" aria-label="Controles de voz">
      <button class="vbtn" id="vRepeat" title="Repetir lo último que dijo"><span class="vi">🔁</span><span class="vl">Repetir</span></button>
      <button class="vbtn" id="vSlow" title="Voz más lenta" aria-pressed="false"><span class="vi">🐢</span><span class="vl">Lento</span></button>
      <button class="vbtn" id="vCC" title="Subtítulos" aria-pressed="true"><span class="vi">💬</span><span class="vl">Subtítulos</span></button>
      <button class="vbtn" id="vMute" title="Silenciar al tutor" aria-pressed="false"><span class="vi">🔊</span><span class="vl">Sonido</span></button>
    </div>
    <div class="status-line" id="statusLine"></div>
  </section>
  <section class="panel"><div id="view"></div></section>
</main>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status"></div>
<script>
/*__JS__*/
</script>
</body>
</html>
