<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF7EE">
<title>Charla · Inglés conversacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A33; --ink2:#4A5A64; --bg:#FFF7EE; --card:#FFFFFF; --line:#EADFD2;
  --teal:#0F766E; --teal2:#14B8A6; --tealbg:#E3F5F2; --coral:#FF6B4A; --coral2:#E9532F; --sun:#FFC94D; --plum:#5B3E96;
  --ok:#14A37F; --bad:#D9534F; --radius:20px; --shadow:0 10px 30px -14px rgba(27,42,51,.35);
  --head:56px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.15;margin:.2em 0 .4em}
h1{font-size:clamp(1.6rem,3.2vw,2.3rem)} h2{font-size:1.35rem;margin-top:1.2em} h3{font-size:1.1rem}
button{font:inherit;color:inherit;cursor:pointer} button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
small{font-size:.82em}
.muted{color:var(--ink2)} .fine{color:var(--ink2);font-size:.84rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;font-weight:800;color:var(--teal);margin:0}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:30;height:var(--head);display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(255,247,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:'Baloo 2';font-weight:800;font-size:1.4rem;color:var(--teal)}
.brand svg{width:34px;height:34px}
#nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:700;color:var(--ink2);white-space:nowrap}
#nav button.on{background:var(--tealbg);color:var(--teal)}
#nav[hidden]+#btnSettings{margin-left:auto}
#btnSettings{border:0;background:none;font-size:1.3rem;padding:6px;border-radius:12px}

/* ---------- Distribución ---------- */
.layout{display:grid;grid-template-columns:minmax(320px,40%) 1fr;gap:0;align-items:start}
.stage{position:sticky;top:calc(var(--head) + 12px);height:calc(100vh - var(--head) - 24px);height:calc(100dvh - var(--head) - 24px);margin:12px;border-radius:28px;overflow:hidden;background:#0F5E63;box-shadow:var(--shadow);isolation:isolate}
.scene,.scene svg{position:absolute;inset:0;width:100%;height:100%}
.panel{padding:12px 20px 60px;min-width:0}
#view{max-width:720px;margin:0 auto}

/* ---------- Personaje ---------- */
.char-wrap{position:absolute;left:50%;bottom:78px;width:min(70%,330px);transform:translateX(-50%);z-index:2;--m:0}
.ch-svg{width:100%;height:auto;overflow:visible;display:block}
.ch-root{transform-origin:110px 252px;animation:breathe 3.4s ease-in-out infinite}
.ch-head{transform-origin:110px 150px;transition:transform .35s ease}
.ch-arm{transform-origin:150px 196px;transition:transform .35s ease}
.ch-tail{transform-origin:146px 214px;animation:wag 2.6s ease-in-out infinite}
.ch-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.ch-pupils{transition:transform .3s}
.ch-brows path{transition:transform .3s}
.ch-mouth-open{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(calc(.08 + var(--m) * .92));opacity:min(1, calc(var(--m) * 6))}
.ch-mouth-closed{opacity:calc(1 - var(--m) * 5)}
.ch-beak-low{transform:translateY(calc(var(--m) * 8px))}
.talking .ch-head{animation:bob .55s ease-in-out infinite alternate}
.ch-fx{opacity:0;transition:opacity .3s}
.ch-fx-listen path{fill:none;stroke:var(--sun);stroke-width:4;stroke-linecap:round}
.ch-fx-think circle{fill:#fff}
.mood-greet .ch-arm{animation:wave .45s ease-in-out 6 alternate}
.mood-listen .ch-head{transform:rotate(-7deg)}
.mood-listen .ch-fx-listen{opacity:1;animation:pulse 1s ease-in-out infinite}
.mood-think .ch-head{transform:rotate(5deg)}
.mood-think .ch-pupils{transform:translate(3px,-4px)}
.mood-think .ch-brow-l{transform:translateY(-4px)}
.mood-think .ch-fx-think{opacity:1}
.mood-celebrate .ch-root{animation:hop .45s ease-out 3}
.mood-celebrate .ch-arm{transform:rotate(-28deg)}
.mood-celebrate .ch-fx-celebrate{opacity:1;animation:pop 1s ease-out}
.mood-correct .ch-head{animation:nod .7s ease-in-out 2}
.mood-correct .ch-fx-correct{opacity:1}
.mood-correct .ch-brows path{transform:translateY(-2px)}
@keyframes breathe{50%{transform:scale(1.015,.99)}}
@keyframes wag{50%{transform:rotate(9deg)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes bob{from{transform:rotate(-1.5deg) translateY(0)}to{transform:rotate(1.5deg) translateY(-2px)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-32deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes hop{40%{transform:translateY(-16px)}}
@keyframes nod{30%{transform:rotate(4deg) translateY(3px)}70%{transform:rotate(-2deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- Globo de subtítulos ---------- */
.bubble{position:absolute;top:16px;left:16px;right:16px;z-index:3;background:#fff;border-radius:18px;padding:10px 14px 12px;box-shadow:var(--shadow);max-height:42%;overflow:auto}
.bubble::after{content:'';position:absolute;left:50%;bottom:-9px;width:18px;height:18px;background:#fff;transform:rotate(45deg);border-radius:3px}
.bubble.is-npc{background:#FFF3D6}.bubble.is-npc::after{background:#FFF3D6;left:80%}
.bubble-who{font-size:.75rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.bubble.is-npc .bubble-who{color:#9A6B00}
.bubble-text{font-size:1.08rem;font-weight:600}
.bubble.es .bubble-text{color:var(--ink2);font-style:italic}
.bubble .w{border-radius:4px;transition:background .1s}
.bubble .w.on{background:var(--sun)}
.cc-off-msg small{color:var(--ink2);font-weight:400}

.npc{position:absolute;right:18px;bottom:96px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.0;transition:opacity .25s}
.npc:not([hidden]){opacity:.55}
.npc.talking{opacity:1}
.npc-ava{width:58px;height:58px;border-radius:50%;background:#FFF3D6;display:grid;place-items:center;font-size:1.8rem;box-shadow:var(--shadow);border:3px solid #fff}
.npc.talking .npc-ava{animation:pulse-ring 1s ease-in-out infinite}
.npc-name{background:#fff;border-radius:999px;padding:0 8px;font-size:.75rem;font-weight:800}
@keyframes pulse-ring{50%{box-shadow:0 0 0 8px rgba(255,201,77,.45)}}

/* ---------- Controles de voz ---------- */
.vctl{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:4;display:flex;gap:6px;background:rgba(255,255,255,.94);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.vbtn{border:0;background:none;border-radius:999px;padding:6px 10px;display:flex;align-items:center;gap:4px;font-weight:700;font-size:.82rem;color:var(--ink)}
.vbtn .vi{font-size:1rem}
.vbtn.on{background:var(--tealbg);color:var(--teal)}
#vMute.on{background:#FDE7E2;color:var(--coral2)}
.status-line{position:absolute;left:0;right:0;bottom:6px;z-index:4;display:flex;justify-content:center;gap:12px;white-space:nowrap;overflow:hidden;font-size:.7rem;color:rgba(255,255,255,.85);padding:0 10px}

/* ---------- Tarjetas y elementos ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:12px}
.lead{font-size:1.1rem;color:var(--ink2)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--tealbg);color:var(--teal);transition:transform .08s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 6px 0 -1px var(--coral2)}
.btn.primary:hover{background:#ff7a5c}
.btn.ghost{background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.btn.soft{background:var(--tealbg);color:var(--teal)}
.btn.danger{background:#FDE7E2;color:var(--bad)}
.btn.big{padding:15px 22px;font-size:1.05rem}
.btn.sm{padding:7px 12px;font-size:.88rem}
.link{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.icon-btn{border:0;background:#F3EEE8;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.actions.col{flex-direction:column;align-items:stretch}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--sun);color:#5A3E00;font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:999px;margin-top:4px}
.notice{background:#FFF3D6;border-radius:14px;padding:12px 14px;margin:12px 0}
.notice.soft{background:#F3F7F6}
.hint-box{background:#FFF3D6;border-radius:12px;padding:10px 12px;margin:8px 0}
.good-box{background:#E1F6EE;border-radius:12px;padding:10px 12px;margin:8px 0;color:#0B5A44}
.good-box.big{font-size:1.1rem;font-weight:700;padding:16px}

.method{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.method span{background:var(--tealbg);color:var(--teal);font-weight:800;border-radius:999px;padding:6px 12px;font-size:.9rem}
.field{display:block;margin:10px 0}.field span{display:block;font-weight:800;margin-bottom:4px}
.field input,.ans-form input{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff}
.field input:focus,.ans-form input:focus{border-color:var(--teal2);outline:none}
.field-label{font-weight:800;margin:14px 0 6px}

.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.char-card{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px 10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;transition:border-color .2s,transform .15s}
.char-card:hover{transform:translateY(-2px)}
.char-card.sel{border-color:var(--coral);box-shadow:0 0 0 4px #FFE1D8}
.char-card .mini{width:100%;max-width:120px;background:linear-gradient(#E3F5F2,#fff);border-radius:14px;padding:6px}
.char-card b{font-family:'Baloo 2';font-size:1.15rem}
.char-card .species{font-size:.8rem;color:var(--teal);font-weight:800}
.char-card .tag{font-size:.82rem;color:var(--ink2)}
.char-card .listen-btn{margin-top:6px;font-size:.8rem;font-weight:800;color:var(--coral2)}
.checks-box{margin-top:16px;background:#F7F3EE;border-radius:14px;padding:10px 14px}
.checks-box summary{font-weight:800;cursor:pointer}
.status-list{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:.92rem}

/* Examen */
.test-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.test-meta{display:flex;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.test-meta span{background:#F3EEE8;border-radius:999px;padding:4px 10px;font-size:.9rem}
.progress{height:8px;background:#F0E8DF;border-radius:999px;overflow:hidden;margin:6px 0 18px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .4s}
.skill-chip{display:inline-block;background:var(--tealbg);color:var(--teal);font-weight:800;border-radius:999px;padding:4px 12px;font-size:.88rem}
.audio-box{background:#F7F3EE;border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.wave{display:flex;justify-content:center;align-items:center;gap:5px;height:36px}
.wave i{display:block;width:6px;height:12px;background:var(--teal2);border-radius:4px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:32px}}
.say{color:var(--coral2)}
.q-text{font-weight:700;font-size:1.05rem}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 16px;font-weight:700;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--teal2)}
.opt.picked{border-color:var(--teal);background:var(--tealbg)}
.opt.right{border-color:var(--ok);background:#E1F6EE}
.opt.wrong{border-color:var(--bad);background:#FDECEA}
.opt:disabled{opacity:1;cursor:default}
.sentence{font-size:1.25rem;font-weight:700;background:#F7F3EE;padding:16px;border-radius:14px}
.blank{color:var(--coral2);letter-spacing:2px}

/* Respuesta / micrófono */
.answer{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#FBF8F4;border:2px dashed var(--line);border-radius:18px;padding:16px}
.answer.done{opacity:.8;border-style:solid}
.answer.done .mic,.answer.done .ans-tools,.answer.done .ans-form,.answer.done .ans-hint{display:none}
.ans-label{margin:0;font-weight:800}
.ans-live{min-height:1.5em;text-align:center;font-size:1.05rem}
.ans-live .you{font-weight:800;color:var(--teal)}
.mic{border:0;background:var(--coral);color:#fff;border-radius:999px;padding:12px 22px 12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;box-shadow:0 6px 0 -1px var(--coral2)}
.mic-ico{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.mic-ico::before{content:'🎤';font-size:1.4rem}
.mic.on{background:var(--teal);box-shadow:0 6px 0 -1px #0b5a54}
.mic.on .mic-ico{animation:pulse-ring 1s infinite}
.ans-form{display:flex;gap:8px;width:100%}
.ans-form[hidden]{display:none}
.ans-tools{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.ans-hint{background:#FFF3D6;border-radius:10px;padding:8px 12px;width:100%}

.diff{margin-top:12px}
.diff-words{display:flex;flex-wrap:wrap;gap:6px}
.diff-words span{padding:3px 9px;border-radius:8px;font-weight:700}
.diff-words .ok{background:#E1F6EE;color:#0B5A44}
.diff-words .miss{background:#F1ECE6;color:#9A8C80;text-decoration:underline wavy #D9A08F}
.meter{height:10px;background:#F0E8DF;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));border-radius:999px}
.meter.na{background:repeating-linear-gradient(45deg,#F0E8DF 0 6px,#E6DDD2 6px 12px)}

/* Resultados */
.level-badge{display:flex;gap:16px;align-items:center;margin:12px 0}
.level-badge .lv{flex:none;width:92px;height:92px;border-radius:24px;background:linear-gradient(135deg,var(--coral),#FF9A5C);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:2.4rem;display:grid;place-items:center;box-shadow:var(--shadow)}
.level-badge p{margin:0;color:var(--ink2)}
.skills{display:grid;gap:10px}
.skill-top{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.skill-top .na{color:var(--ink2);font-style:italic}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two-col ul{padding-left:18px;margin:0}.two-col li{margin:4px 0}
.rec-card{display:flex;gap:14px;align-items:center;background:var(--tealbg);border-radius:16px;padding:14px;margin-top:18px}
.rec-ico{font-size:2rem}.rec-card p{margin:0}

/* Plan */
.goal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.goal-card{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.goal-card.sel{border-color:var(--coral);box-shadow:0 0 0 4px #FFE1D8}
.g-ico{font-size:1.8rem}
.plan-opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--coral);border-radius:16px;padding:14px;background:#FFF9F6}
.plan-opt input{margin-top:5px;accent-color:var(--coral)}
.plan-opt span{display:block}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;min-width:56px}
.day.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.week{display:flex;justify-content:space-between;align-items:center;background:#F7F3EE;border-radius:16px;padding:12px 16px;margin:12px 0}
.week span{display:block;font-size:.9rem}
.dots{display:flex;gap:6px}.dots span{width:18px;height:18px;border-radius:50%;background:#E6DDD2}.dots span.on{background:var(--ok)}
.next-session{border:2px solid var(--teal2);border-radius:18px;padding:16px;background:linear-gradient(#F2FBF9,#fff)}
.session-steps{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:10px}
.session-steps li{display:flex;gap:10px;align-items:center}
.session-steps li>span{font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;background:#fff;border-radius:12px;box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
.session-steps b,.session-steps small{display:block}
.lesson-list{display:grid;gap:8px}
.lesson-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.lesson-row.done{background:#F6FBF9}
.l-ico{font-size:1.5rem}.l-info{flex:1;min-width:0}.l-info b,.l-info .muted{display:block}.l-info .muted{font-size:.85rem}

/* Lección */
.stepper{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stepper li{font-size:.72rem;font-weight:800;color:#A99C90;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.stepper li span{width:28px;height:28px;border-radius:50%;background:#F0E8DF;display:grid;place-items:center;font-size:.85rem}
.stepper li.on{color:var(--coral2)}.stepper li.on span{background:var(--coral);color:#fff}
.stepper li.past{color:var(--teal)}.stepper li.past span{background:var(--teal2);color:#fff}
.transcript{background:#F7F3EE;border-radius:14px;padding:12px 16px}
.transcript p{margin:6px 0}.transcript .es{display:block;color:var(--ink2);font-size:.9rem;font-style:italic}
.q-en{font-size:1.3rem;margin-bottom:0}.q-es{color:var(--ink2);margin-top:2px}
.phrase{background:linear-gradient(135deg,#FFF3EC,#FFF9F2);border-radius:18px;padding:16px 18px;border:1px solid #FFE1D3}
.p-en{font-size:1.4rem;font-weight:800;margin:0;font-family:'Baloo 2'}
.p-es{color:var(--ink2);margin:2px 0 8px}
.p-tip{font-size:.92rem;margin:0 0 10px}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:none}
.msg{max-width:88%;display:flex;flex-direction:column}
.msg .who{font-size:.72rem;font-weight:800;color:var(--ink2);margin:0 8px}
.msg p{margin:0;padding:10px 14px;border-radius:16px;font-size:1.02rem}
.msg.tutor{align-self:flex-start}.msg.tutor p{background:var(--tealbg);border-top-left-radius:4px}
.msg.user{align-self:flex-end;align-items:flex-end}.msg.user p{background:#FFE7DE;border-top-right-radius:4px}
.msg.note{align-self:stretch;max-width:100%}
.blur{filter:blur(5px);cursor:pointer;user-select:none}
.note-chip{display:inline-block;background:#FFF3D6;border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700;align-self:center}
.corr{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.corr-row{padding:12px 16px;border-bottom:1px solid var(--line)}
.corr-row>span{display:block;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.corr-row p{margin:2px 0 0;font-size:1.1rem;font-weight:700}
.corr-row.said{background:#FDF1EE}.corr-row.said span{color:var(--bad)}.corr-row.said p{text-decoration:line-through;text-decoration-color:rgba(217,83,79,.4)}
.corr-row.natural{background:#EEF9F5}.corr-row.natural span{color:var(--ok)}
.corr-row.retry span{color:var(--teal)}
.corr-row.retry .answer{background:none;border:0;padding:6px 0 0}
.corr-tip{margin:0;padding:10px 16px;background:#FFFBF0;border-bottom:1px solid var(--line)}

.more{margin-top:12px}.more summary{font-weight:800;cursor:pointer}
.save-list{display:grid;gap:8px}

.done-box{text-align:center;padding:10px}

/* Progreso */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#F7F3EE;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.s-num{font-family:'Baloo 2';font-weight:800;font-size:1.8rem;color:var(--teal);line-height:1}
.stat>span:last-child{font-size:.82rem;color:var(--ink2);font-weight:700}
.review-list{display:grid;gap:8px;margin-bottom:12px}
.review-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.review-item>div{flex:1;min-width:0}.review-item b,.review-item span,.review-item small{display:block}.review-item span,.review-item small{color:var(--ink2);font-size:.88rem}
.reps{color:var(--ok);letter-spacing:2px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(27,42,51,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:22px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toggle input{position:absolute;opacity:0}
.toggle .sw{flex:none;width:44px;height:26px;border-radius:999px;background:#E6DDD2;position:relative;transition:background .2s;margin-top:2px}
.toggle .sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.sw{background:var(--teal2)}
.toggle input:checked+.sw::after{transform:translateX(18px)}
.toggle input:focus-visible+.sw{outline:3px solid var(--teal2);outline-offset:2px}
.toggle b,.toggle small{display:block}.toggle small{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;transition:transform .3s;font-weight:700;max-width:90vw}
#toast.show{transform:translate(-50%,0)}

/* ---------- Celular ---------- */
@media (max-width:860px){
  .layout{display:block}
  .stage{position:sticky;top:var(--head);z-index:20;height:212px;margin:0;border-radius:0 0 24px 24px}
  .char-wrap{left:6px;bottom:8px;width:138px;transform:none}
  .bubble{left:150px;right:10px;top:10px;max-height:142px;padding:8px 12px}

  .bubble-text{font-size:.98rem}
  .vctl{left:auto;right:8px;bottom:8px;transform:none;padding:3px;gap:2px}
  .vbtn{padding:6px 8px}
  .vbtn .vl{display:none}
  .status-line{display:none}
  .npc{right:auto;left:150px;bottom:8px;flex-direction:row;gap:6px}

  .panel{padding:4px 12px 40px}
  .card{padding:18px;border-radius:18px}
  .char-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .char-card .tag{display:none}
  .two-col{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .goal-grid{grid-template-columns:1fr 1fr}
  .stepper li{font-size:0}.stepper li span{font-size:.8rem}
  #nav{flex:1;min-width:0;justify-content:flex-start;margin-left:4px}
  #nav button{padding:6px 7px;font-size:.8rem}
  .brand span{display:none}
  .topbar{padding:0 8px;gap:6px}
  #btnSettings{padding:4px;font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

      <defs><radialGradient id="glow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#14B8A6" stop-opacity=".55"/><stop offset="1" stop-color="#0F5E63" stop-opacity="0"/></radialGradient></defs>
      <rect width="400" height="300" fill="url(#glow)"/>
      <circle cx="60" cy="60" r="34" fill="#FFC94D" opacity=".18"/><circle cx="350" cy="90" r="50" fill="#FF6B4A" opacity=".14"/>
      <ellipse cx="200" cy="300" rx="260" ry="70" fill="#0B4A4E"/>`);
  }
}

/* ===== engine.js ===== */
/* ============================================================
   MOTOR LOCAL: utilidades, correcciones, comparación de frases,
   diálogos de lección y conversación libre, calificación.
   Funciona sin internet ni API. Si hay IA disponible, app.js la usa
   primero y este motor queda como respaldo.
   ============================================================ */

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s;
const titleCase = s => String(s).trim().split(/\s+/).map(cap).join(' ');
const shorten = (s, n) => { const w = String(s).trim().replace(/[.!?]+$/, '').split(/\s+/); return w.slice(0, n).join(' ').toLowerCase() + (w.length > n ? '…' : ''); };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wordCount = s => (String(s).trim().match(/[a-záéíóúñü']+/gi) || []).length;

/* ---------- Normalización y comparación de frases ----------
   IMPORTANTE: esto compara el TEXTO que reconoció el micrófono con
   la frase objetivo. No evalúa pronunciación.                   */
const CONTRACTIONS = [
  [/\bi'm\b/g, 'i am'], [/\bcan't\b/g, 'cannot'], [/\bwon't\b/g, 'will not'], [/\blet's\b/g, 'let us'],
  [/n't\b/g, ' not'], [/'re\b/g, ' are'], [/'ve\b/g, ' have'], [/'ll\b/g, ' will'], [/'d\b/g, ' would'], [/'s\b/g, ' is']
];
const NUMBERS = { '1': 'one', '2': 'two', '3': 'three', '4': 'four', '5': 'five', '6': 'six', '7': 'seven', '8': 'eight', '9': 'nine', '10': 'ten', '12': 'twelve', '50': 'fifty' };

function normalize(s) {
  let t = String(s || '').toLowerCase().replace(/[’`´]/g, "'");
  CONTRACTIONS.forEach(([re, r]) => { t = t.replace(re, r); });
  t = t.replace(/[^a-z0-9áéíóúñü' ]+/g, ' ').replace(/'/g, '');
  return t.split(/\s+/).filter(Boolean).map(w => NUMBERS[w] || w);
}

function compareText(target, said) {
  const a = normalize(target), b = normalize(said);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? 1 + dp[i + 1][j + 1] : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(n).fill(false);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ok[i] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const lcs = dp[0][0];
  const ratio = n + m ? (2 * lcs) / (n + m) : 0;
  return { ratio, words: a.map((w, k) => ({ w, ok: ok[k] })), missing: a.filter((w, k) => !ok[k]) };
}

/* ---------- Detección de español / comandos ---------- */
const SP_WORDS = new Set('que de el la los las y es yo mi mis por para pero muy con un una unos unas tengo quiero como cómo donde dónde cuando cuándo porque gracias hola bueno también ella él nosotros estoy está están soy eres fue era lo le les te nos del al este esta eso esto ahí aquí ya más menos sé entiendo puedo hablar inglés español qué decir hacer hay bien sí tiene tienes cuál nada algo'.split(' '));
function spanishRatio(s) {
  const w = String(s).toLowerCase().match(/[a-záéíóúñü]+/g) || [];
  if (!w.length) return 0;
  return w.filter(x => SP_WORDS.has(x)).length / w.length;
}
const isSpanish = s => wordCount(s) >= 2 && spanishRatio(s) >= 0.34;
const isHelpRequest = s => /\b(no entiendo|no entendí|no le entiendo|repite|repítelo|otra vez|what\?|sorry\?|pardon|repeat|i don't understand|i didn't understand|can you repeat|again please|more slowly|slower)\b/i.test(s);

/* ---------- Correcciones (errores típicos de hispanohablantes) ---------- */
const GLOBAL_CORRECTIONS = [
  { re: /\bi have (\w+) years (working|living|studying)\b([^.,!?]*)/i, rep: (m0, n, v, rest) => `I've been ${v}${rest.replace(/\s+$/, '')} for ${n} years`, tip: 'Para algo que sigue pasando: "I\'ve been working here for…".', tag: 'Duración (for / have been)' },
  { re: /\bi (?:have|has) (\d+|[a-z]+(?:-[a-z]+)?) years(?! (?:of|working|living|studying|ago))(?: old)?\b/i, rep: (m0, n) => `I'm ${n} years old`, tip: 'La edad se dice con "to be": "I\'m 30 years old", no con "have".', tag: 'Decir la edad' },
  { re: /\bi have (hungry|thirsty|sleepy|cold|hot)\b/i, rep: (m0, a) => `I'm ${a}`, tip: 'Hambre, sed, frío o sueño van con "to be": "I\'m hungry".', tag: 'Estados con "to be"' },
  { re: /\bi(?:'m| am) agree\b/i, rep: 'I agree', tip: '"Agree" es verbo: se dice "I agree", sin "am".', tag: '"I agree"' },
  { re: /\bpeople is\b/i, rep: 'people are', tip: '"People" es plural: "people are".', tag: 'Concordancia' },
  { re: /\b(he|she|it) don't\b/i, rep: (m0, a) => `${a} doesn't`, tip: 'Con he/she/it se usa "doesn\'t".', tag: 'Tercera persona' },
  { re: /\b(he|she) have\b/i, rep: (m0, a) => `${a} has`, tip: 'Con he/she se usa "has".', tag: 'Tercera persona' },
  { re: /\bexplain me\b/i, rep: 'explain to me', tip: 'Se dice "explain to me" o "explain it to me".', tag: 'Verbos con preposición' },
  { re: /\bthe life is\b/i, rep: 'life is', tip: 'En general no se usa "the": "Life is…".', tag: 'Uso de "the"' },
  { re: /\bi like very much ([a-z ]+)/i, rep: (m0, a) => `I really like ${a}`, tip: 'Más natural: "I really like…" o "I like … a lot".', tag: 'Orden de palabras' },
  { re: /\bmake (a|some) questions?\b/i, rep: (m0, a) => `ask ${a} question${a === 'some' ? 's' : ''}`, tip: 'Preguntas se "hacen" con "ask": "ask a question".', tag: 'Make vs. ask' },
  { re: /\bin the night\b/i, rep: 'at night', tip: 'Se dice "at night".', tag: 'Preposiciones de tiempo' },
  { re: /\bdepends? of\b/i, rep: m0 => m0.replace(/of$/i, 'on'), tip: '"Depend" va con "on": "It depends on…".', tag: 'Verbos con preposición' },
  { re: /\bsince (\w+) (years|months|weeks|days)\b/i, rep: (m0, a, b) => `for ${a} ${b}`, tip: 'Con duración se usa "for": "for three years". "Since" va con un punto de inicio: "since 2020".', tag: 'For vs. since' },
  { re: /\bdidn't (went|saw|did|had|ate|came|bought|took|made|got)\b/i, rep: (m0, v) => `didn't ${({ went: 'go', saw: 'see', did: 'do', had: 'have', ate: 'eat', came: 'come', bought: 'buy', took: 'take', made: 'make', got: 'get' })[v.toLowerCase()]}`, tip: 'Después de "didn\'t" el verbo va en forma base: "I didn\'t go".', tag: 'Pasado negativo' },
  { re: /\b(could|can|should|would|will|must|might) to (\w+)/i, rep: (m0, a, b) => `${a} ${b}`, tip: `Después de can/could/should no va "to".`, tag: 'Verbos modales' },
  { re: /\bsuggest you to (\w+)/i, rep: (m0, a) => `suggest that you ${a}`, tip: 'Se dice "I suggest that you…" o "I suggest + -ing".', tag: 'Suggest / recommend' },
  { re: /\brecommend you to (\w+)/i, rep: (m0, a) => `recommend that you ${a}`, tip: 'Se dice "I recommend that you…" o "I recommend + -ing".', tag: 'Suggest / recommend' },
  { re: /\bmore (better|worse|bigger|easier|cheaper|faster)\b/i, rep: (m0, a) => a, tip: '"Better", "bigger"… ya son comparativos: no lleva "more".', tag: 'Comparativos' },
  { re: /\bhow (it|this|that) is called\b/i, rep: (m0, a) => `what ${a} is called`, tip: 'Se pregunta "What is it called?"', tag: 'Preguntas' },
  { re: /\bi(?:'m| am) boring\b/i, rep: "I'm bored", tip: '"I\'m bored" = estoy aburrido. "I\'m boring" = soy aburrido.', tag: 'Bored vs. boring' },
  { re: /\b(go|went|going|come|came|get|got|arrive|arrived) to home\b/i, rep: (m0, a) => `${a} home`, tip: 'Con "home" no se usa "to": "go home".', tag: 'Go home' },
  { re: /\bassist(?:ed)? to\b/i, rep: m0 => /ed/i.test(m0) ? 'attended' : 'attend', tip: 'Asistir a un evento = "attend". "Assist" significa ayudar.', tag: 'Falsos amigos' },
  { re: /^(is|was) (very|so|really|too|a|an|good|nice|great|bad|delicious|fun|interesting|expensive|cheap|far|close|easy|hard)\b/i, rep: (m0, a, b) => `It ${a.toLowerCase()} ${b}`, tip: 'En inglés siempre va el sujeto: "It\'s very good".', tag: 'Sujeto obligatorio' }
];

function tidy(s) {
  let t = String(s).trim().replace(/\s+/g, ' ');
  t = t.replace(/\bi\b/g, 'I').replace(/\bi'(m|d|ve|ll)\b/g, "I'$1");
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?…]$/.test(t)) t += /^(can|could|would|do|does|is|are|what|where|how|when|why|who|may|should)\b/i.test(t) ? '?' : '.';
  return t;
}

function applyCorrections(text, extra = []) {
  let t = String(text || '').trim();
  if (!t) return null;
  const tips = [], tags = [];
  for (const rule of [...extra, ...GLOBAL_CORRECTIONS]) {
    const re = new RegExp(rule.re.source, rule.re.flags.replace('g', ''));
    if (re.test(t)) {
      const before = t;
      t = t.replace(re, typeof rule.rep === 'function' ? rule.rep : () => rule.rep);
      if (t !== before) { tips.push(rule.tip); tags.push(rule.tag); }
    }
  }
  if (!tips.length) return null;
  return { said: text.trim(), natural: tidy(t), tip_es: tips.join(' '), tags };
}

/* ---------- Relleno de plantillas: {slot}, {Slot}, {slot|predeterminado} ---------- */
function fill(tpl, vars) {
  return String(tpl).replace(/\{(\w+)(?:\|([^}]*))?\}/g, (m0, k, def) => {
    const low = k.charAt(0).toLowerCase() + k.slice(1);
    let v = vars[k] ?? vars[low];
    if (v === undefined || v === null || v === '') v = def ?? '';
    if (/^[A-Z]/.test(k) && v) v = String(v).charAt(0).toUpperCase() + String(v).slice(1);
    return v;
  }).replace(/\s{2,}/g, ' ').replace(/\s+([.,!?])/g, '$1');
}

/* ---------- Diálogo de lección (motor local) ---------- */
class LessonDialog {
  constructor(lesson, ctx) {
    this.lesson = lesson; this.ctx = ctx;
    this.turns = lesson.conversation.turns.filter(t => !t.minLevel || ctx.levelIdx + 1 >= t.minLevel);
    this.i = 0; this.retries = 0;
    this.slots = { tutor: ctx.tutorName, user: ctx.userName || '' };
  }
  get current() { return this.turns[this.i]; }
  question(simple = false) {
    const t = this.current; if (!t) return '';
    return fill((simple || this.ctx.levelIdx === 0) && t.simple ? t.simple : t.ask, this.slots);
  }
  opening() { return fill(this.lesson.conversation.opening, this.slots) + ' ' + this.question(); }
  respond(text) {
    const t = this.current;
    const correction = applyCorrections(text, this.lesson.corrections || []);
    if (!t) return { reply: fill(this.lesson.conversation.closing, this.slots), end: true, correction };
    if (isHelpRequest(text)) return { reply: 'No problem. ' + this.question(true), hint_es: t.hint, model: t.model, correction: null, help: true };
    if (isSpanish(text)) return { reply: `Try it in English. You can say: ${t.model}`, hint_es: 'Intenta decirlo en inglés. ' + (t.hint || ''), model: t.model, correction: null, help: true };
    let exp = null, m = null;
    for (const e of t.expect || []) { m = text.match(e.re); if (m) { exp = e; break; } }
    if (!exp) {
      if ((t.expect || []).length && this.retries < 1) {
        this.retries++;
        return { reply: "Sorry, I didn't quite get that. " + this.question(true), hint_es: t.hint, model: t.model, correction, retry: true };
      }
      if (t.anySlots) Object.entries(t.anySlots).forEach(([k, v]) => { if (!this.slots[k]) this.slots[k] = v; });
      exp = { reply: t.any || 'Okay.' };
    }
    if (exp.slot) this.slots[exp.slot] = exp.val ? exp.val(m, text) : (m[1] || m[0]).trim();
    if (exp.slot === 'name' && this.slots.name) this.ctx.learnedName = this.slots.name;
    this.retries = 0; this.i++;
    const ack = fill(exp.reply, this.slots);
    if (this.i >= this.turns.length) return { reply: ack + ' ' + fill(this.lesson.conversation.closing, this.slots), end: true, correction };
    return { reply: ack + ' ' + this.question(), correction };
  }
}

/* ---------- Conversación libre (motor local) ---------- */
function detectCategories(text) {
  const t = ' ' + String(text).toLowerCase().replace(/[^a-záéíóúñü' -]+/g, ' ') + ' ';
  const hits = [];
  for (const [cat, words] of Object.entries(LEXICON)) {
    for (const w of words) if (t.includes(' ' + w + ' ')) { hits.push({ cat, w }); break; }
  }
  return hits;
}
function feeling(text) {
  const w = String(text).toLowerCase().match(/[a-z]+/g) || [];
  const neg = /\b(not|don't|isn't|wasn't)\s+(good|great|fine|happy|fun)\b/i.test(text);
  if (neg || w.some(x => FEELINGS.negative.includes(x))) return 'negative';
  if (w.some(x => FEELINGS.positive.includes(x))) return 'positive';
  return null;
}

class FreeDialog {
  constructor(topicId, ctx, maxTurns) {
    this.topic = FREE_TOPICS.find(t => t.id === topicId) || FREE_TOPICS[1];
    this.ctx = ctx; this.qi = 0; this.turn = 0; this.used = new Set(); this.facts = []; this.referenced = false;
    this.maxTurns = maxTurns || [5, 6, 7, 8, 9][ctx.levelIdx] || 6;
    this.bank = ctx.levelIdx <= 1 ? this.topic.qA : this.topic.qB;
    this.lastQuestion = '';
  }
  nextTopicQuestion() {
    const q = this.bank[this.qi % this.bank.length]; this.qi++; return q;
  }
  opening() {
    const hi = this.ctx.userName ? `Hi, ${this.ctx.userName}!` : 'Hi!';
    this.lastQuestion = this.nextTopicQuestion();
    return `${hi} ${this.lastQuestion}`;
  }
  respond(text) {
    const correction = applyCorrections(text);
    if (isHelpRequest(text)) return { reply: 'Sure, let me say it again. ' + this.lastQuestion, help: true, slow: true, correction: null };
    if (isSpanish(text)) return { reply: `Let's try in English. ${this.lastQuestion}`, hint_es: 'Intenta responder en inglés, aunque sea con pocas palabras.', help: true, correction: null };
    this.turn++;
    const cats = detectCategories(text);
    const fresh = cats.find(c => !this.used.has(c.w));
    const feel = feeling(text);
    let ack;
    if (feel && (!fresh || Math.random() < 0.5)) ack = pick(ACKS[feel]);
    else if (fresh) ack = pick(ACKS[fresh.cat]);
    else if (wordCount(text) <= 2 && /^(yes|yeah|yep|sure|no|nope|not really|maybe)\b/i.test(text.trim())) ack = /^n/i.test(text.trim()) ? 'Okay, fair enough.' : 'Cool.';
    else ack = pick(ACKS.generic);
    if (this.turn >= this.maxTurns) {
      const ref = this.facts.length ? ` I really enjoyed hearing about ${this.facts[0].w}.` : '';
      return { reply: fill(ack, { w: fresh?.w, W: fresh ? titleCase(fresh.w) : '' }) + ref + ' Great conversation! You did really well today.', end: true, correction };
    }
    let q;
    if (fresh && Math.random() < 0.75) {
      this.used.add(fresh.w); this.facts.push(fresh);
      q = pick(FOLLOWUPS[fresh.cat]);
    } else if (!this.referenced && this.facts.length && this.turn >= 3) {
      this.referenced = true;
      const f = this.facts[0];
      q = `Earlier you mentioned ${f.cat === 'place' ? titleCase(f.w) : f.w}. ` + this.nextTopicQuestion();
    } else q = this.nextTopicQuestion();
    if (fresh) this.used.add(fresh.w);
    const vars = { w: fresh?.w || '', W: fresh ? titleCase(fresh.w) : '' };
    this.lastQuestion = fill(q, vars);
    return { reply: fill(ack, vars).replace(/\?/g, '.') + ' ' + this.lastQuestion, correction };
  }
}

/* ---------- Calificación de respuestas abiertas (heurística) ----------
   Califica contenido y gramática del TEXTO, no la pronunciación. */
function scoreOpen(text, { minWords = 6, expect = null } = {}) {
  const wc = wordCount(text);
  if (!wc) return { score: 0, note: 'sin respuesta' };
  if (spanishRatio(text) >= 0.3) return { score: 0.1, note: 'respondió en español' };
  const len = Math.min(1, wc / minWords);
  const kw = expect ? (expect.test(text) ? 1 : 0.45) : 0.8;
  const corr = applyCorrections(text);
  const penalty = corr ? Math.min(0.3, corr.tags.length * 0.12) : 0;
  const score = clamp(0.55 * len + 0.45 * kw - penalty, 0, 1);
  return { score, corrections: corr };
}

/* ---------- Prompts para IA (si está configurada) ---------- */

Rules:

Question: "${question}"
Answer: "${answer.replace(/"/g, "'")}"

Rate how well the answer communicates a relevant response, considering grammar, vocabulary range and length. Ignore capitalization/punctuation. Do NOT judge pronunciation.

}

/* ===== voice.js ===== */
/* ============================================================
   VOZ, MICRÓFONO, SINCRONÍA DE BOCA E IA
   Backends (se elige el mejor disponible, en este orden):
   - Voz:  servidor /api/tts (audio real + análisis de amplitud)
           → voz de Claude (artefacto publicado, capacidad "tts")
           → speechSynthesis del navegador (eventos por palabra)
   - Oído: dictado de Claude (artefacto) → Web Speech API → escribir
   - IA:   servidor /api/chat → Claude (capacidad "sample") → reglas locales
   ============================================================ */

const Caps = { server: { chat: false, tts: false }, claudeTTS: null, claudeDictation: null, claudeSample: null, ready: false };

async function detectCaps(onUpdate) {
  // 1) Servidor propio (cuando corres `npm start`)
  try {
    if (/^https?:$/.test(location.protocol)) {
      const r = await fetch('api/config', { cache: 'no-store' });
      if (r.ok && (r.headers.get('content-type') || '').includes('json')) Caps.server = await r.json();
    }
  } catch (e) { /* sin servidor: está bien */ }
  onUpdate && onUpdate();
  // 2) Capacidades de Claude (solo cuando la app está publicada como artefacto)
  const c = (typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function') ? window.claude : null;
  if (c) {
    const safe = p => Promise.resolve(p).catch(() => null);
    const [tts, dict, sample] = await Promise.all([safe(c.use('tts')), safe(c.use('dictation')), safe(c.use('sample'))]);
    Caps.claudeTTS = tts; Caps.claudeDictation = dict; Caps.claudeSample = sample;
  }
  Caps.ready = true;
  Voice.configure(); Ears.configure(); AI.configure();
  onUpdate && onUpdate();
}

/* ---------------- Subtítulos (globo del personaje) ---------------- */
const Subs = {
  el: null, who: null, text: null, words: [], cur: -1,

    const forced = S.settings.mute || Voice.backend === 'none';

    }

  highlight(i) {
    if (i === this.cur || !this.words.length) return;
    this.words.forEach((w, k) => w.classList.toggle('on', k === i));

  hide() { if (this.el) this.el.hidden = true; }

/* ---------------- Sincronía de boca ----------------
   - Audio de servidor: amplitud real de la señal (AnalyserNode).
   - Navegador: cada evento de palabra (onboundary) reancla una línea de
     tiempo de sílabas estimadas.
   - Voz de Claude: la posición en milisegundos (onPosition) reancla la
     misma línea de tiempo.                                              */
const Lip = {
  tl: null, anchorT: 0, anchorPerf: 0, running: false, pending: false, analyser: null, buf: null, raf: 0, smooth: 0,
  build(text, lang, rate) {
    const segs = [], wordStarts = [];
    const syl = lang === 'es' ? 0.15 : 0.19;
    let t = 0.05, ci = 0;
    const re = /\S+/g; let m;
    while ((m = re.exec(text))) {
      const raw = m[0], word = raw.toLowerCase().replace(/[^a-záéíóúñü']/g, '');
      wordStarts.push({ char: m.index, t });
      const groups = word.match(/[aeiouyáéíóú]+/g) || (word ? ['e'] : []);
      let n = groups.length;
      if (lang !== 'es' && n > 1 && /[^aeiou]e$/.test(word)) n--;
      for (let k = 0; k < n; k++) {
        const v = groups[k] || 'e', d = syl / rate;
        const amp = /a|á/.test(v) ? 1 : /o|ó/.test(v) ? 0.8 : /u|ú/.test(v) ? 0.6 : /e|é/.test(v) ? 0.7 : 0.55;
        segs.push({ t0: t, t1: t + d * 0.9, amp }); t += d;
      }
      t += 0.05 / rate;
      if (/[,;:]$/.test(raw)) t += 0.22 / rate;
      if (/[.!?]$/.test(raw)) t += 0.4 / rate;
      ci = m.index;
    }
    return { segs, wordStarts, total: t };
  },
  start(tl, { pending = false } = {}) { this.analyser = null; this.tl = tl; this.pending = pending; this.anchorT = 0; this.anchorPerf = performance.now(); this.running = true; this.loop(); },
  begin() { if (this.pending) { this.pending = false; this.anchorT = 0; this.anchorPerf = performance.now(); } },
  anchorMs(ms) { this.pending = false; this.anchorT = ms / 1000; this.anchorPerf = performance.now(); },
  anchorChar(ci) {
    if (!this.tl) return; this.pending = false;
    let idx = 0; this.tl.wordStarts.forEach((w, k) => { if (w.char <= ci) idx = k; });
    this.anchorT = this.tl.wordStarts[idx].t; this.anchorPerf = performance.now();
  },
  startAnalyser(an) { this.tl = null; this.analyser = an; this.buf = new Uint8Array(an.fftSize); this.running = true; this.pending = false; this.loop(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); this.set(0); this.analyser = null; },
  set(v) { if (Tutor.root) Tutor.root.style.setProperty('--m', v.toFixed(3)); },
  loop() {
    cancelAnimationFrame(this.raf);
    const step = () => {
      if (!this.running) return;
      let m = 0;
      if (this.analyser) {
        this.analyser.getByteTimeDomainData(this.buf);
        let sum = 0; for (let i = 0; i < this.buf.length; i++) { const x = (this.buf[i] - 128) / 128; sum += x * x; }
        const rms = Math.sqrt(sum / this.buf.length);
        m = clamp((rms - 0.015) * 7, 0, 1);
      } else if (this.tl && !this.pending) {
        const t = this.anchorT + (performance.now() - this.anchorPerf) / 1000;
        const s = this.tl.segs.find(sg => t >= sg.t0 && t <= sg.t1);
        if (s) m = s.amp * Math.pow(Math.sin(Math.PI * (t - s.t0) / (s.t1 - s.t0)), 0.8);
        let wi = -1; this.tl.wordStarts.forEach((w, k) => { if (w.t <= t) wi = k; });
        if (wi >= 0) Subs.highlight(wi);
      }
      this.smooth = this.smooth * 0.45 + m * 0.55;
      this.set(this.smooth);
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
};

/* ---------------- Voz (texto a voz) ---------------- */
const Voice = {
  backend: 'none', enVoice: null, enVoice2: null, esVoice: null, token: 0, last: null, ctx: null, audio: null, _resolveLine: null, browserReady: false,
  init() {
    if ('speechSynthesis' in window) {
      const load = () => {
        const vs = speechSynthesis.getVoices();
        if (!vs.length) return;
        const score = (v, prefs) => { let s = 0; prefs.forEach((p, i) => { if (p.test(v.name)) s = Math.max(s, 100 - i); }); return s; };
        const en = vs.filter(v => /^en[-_]/i.test(v.lang));
        const enSorted = en.slice().sort((a, b) => score(b, [/natural/i, /google us english/i, /samantha/i, /aria|jenny|guy/i, /en-us/i]) - score(a, [/natural/i, /google us english/i, /samantha/i, /aria|jenny|guy/i, /en-us/i]) || (/en[-_]us/i.test(b.lang) - /en[-_]us/i.test(a.lang)));
        this.enVoice = enSorted[0] || null;
        this.enVoice2 = enSorted.find(v => v !== this.enVoice && /en[-_](us|gb)/i.test(v.lang)) || null;
        const es = vs.filter(v => /^es[-_]/i.test(v.lang));
        this.esVoice = es.find(v => /es[-_]mx/i.test(v.lang)) || es.find(v => /es[-_](us|419)/i.test(v.lang)) || es[0] || null;
        this.browserReady = !!this.enVoice;
        this.configure(); App.updateStatus && App.updateStatus();
      };
      load(); speechSynthesis.onvoiceschanged = load;
    }
  },
  configure() {
    if (Caps.server.tts) this.backend = 'server';
    else if (Caps.claudeTTS && !this.claudeOff) this.backend = 'claude';
    else if (this.browserReady) this.backend = 'browser';
    else this.backend = 'none';
    if (this.backend === 'claude' && !this._claudeHooked) {
      this._claudeHooked = true;
      const t = Caps.claudeTTS;
      try { t.onState(({ state }) => { if (state === 'speaking') Lip.begin(); }); } catch (e) { }
      try { t.onPosition(({ ms }) => Lip.anchorMs(ms)); } catch (e) { }
    }
  },
  short() { return { server: 'Voz API', claude: 'Voz Claude', browser: 'Voz navegador', none: 'Sin voz' }[this.backend]; },
  label() {
    return { server: 'Voz del servidor (API externa)', claude: 'Voz de Claude', browser: `Voz del navegador${this.enVoice ? ' · ' + this.enVoice.name : ''}`, none: 'Sin voz disponible' }[this.backend];
  },
  unlock() {
    try { if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { }
  },
  baseRate() { const lvl = S.levelIdx ?? 0; return [0.85, 0.92, 1, 1.02, 1.05][lvl] || 0.95; },
  stop() {
    this.token++;
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { }
    try { if (Caps.claudeTTS) Caps.claudeTTS.stop(); } catch (e) { }
    try { if (this.audio) { this.audio.pause(); } } catch (e) { }
    if (this._resolveLine) { const r = this._resolveLine; this._resolveLine = null; r(); }
    Lip.stop(); Tutor.talking(false); NPC.hide();
  },
  async repeat(slow) {
    if (!this.last) return;
    await this.speak(this.last, { slow });
  },
  /* lines: [{text, lang:'en'|'es', who:'tutor'|'npc', npc:{name,icon}}] */
  async speak(lines, opts = {}) {
    if (typeof lines === 'string') lines = [{ text: lines, lang: 'en', who: 'tutor' }];
    lines = lines.filter(l => l && l.text);
    if (!lines.length) return;
    Ears.abort();
    this.stop();
    const my = this.token;
    this.last = lines;
    const slow = opts.slow ?? S.settings.slow;
    for (const line of lines) {
      if (my !== this.token) return;
      const rate = (opts.rate || this.baseRate()) * (slow ? 0.75 : 1) * (line.lang === 'es' ? 1.05 : 1);
      const tl = Lip.build(line.text, line.lang, rate);
      Subs.show(line, tl.wordStarts, opts.audioOnly && line.lang === 'en');
      const isTutor = line.who !== 'npc';
      if (isTutor) { Tutor.talking(true); NPC.hide(); } else { Tutor.talking(false); NPC.show(line.npc); }
      try {
        if (S.settings.mute || this.backend === 'none') await this.silentLine(line, tl, my);
        else if (this.backend === 'server') await this.serverLine(line, rate, isTutor);
        else if (this.backend === 'claude') await this.claudeLine(line, rate, isTutor, tl);
        else await this.browserLine(line, rate, isTutor, tl);
      } catch (e) { console.warn('voz', e); }
      if (!isTutor) Lip.stop();
      Lip.stop(); Tutor.talking(false); NPC.hide();
      if (my !== this.token) return;
      await sleep(180);
    }
  },
  async silentLine(line, tl, my) {
    // Silenciado: solo subtítulos; la boca NO se mueve (no simulamos voz).
    const ms = clamp(line.text.length * 55, 1200, 6000);
    const t0 = performance.now();
    while (performance.now() - t0 < ms) { if (my !== this.token) return; await sleep(100); }
  },
  browserLine(line, rate, isTutor, tl) {
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(line.text);
      const v = line.lang === 'es' ? this.esVoice : (isTutor ? this.enVoice : (this.enVoice2 || this.enVoice));
      if (v) u.voice = v;
      u.lang = line.lang === 'es' ? (this.esVoice?.lang || 'es-MX') : (v?.lang || 'en-US');
      u.rate = rate; u.pitch = isTutor ? Tutor.char.pitch : 0.9;
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(safety); this._resolveLine = null; res(); };
      this._resolveLine = finish;
      if (isTutor) Lip.start(tl, { pending: true });
      u.onstart = () => Lip.begin();
      u.onboundary = e => { if (e.name === 'word' || !e.name) Lip.anchorChar(e.charIndex); };
      u.onend = finish; u.onerror = finish;
      const safety = setTimeout(finish, (tl.total * 1000) * 2.2 + 4000);
      try { speechSynthesis.resume(); } catch (e) { }
      speechSynthesis.speak(u);
    });
  },
  async claudeLine(line, rate, isTutor, tl) {
    const t = Caps.claudeTTS;
    if (isTutor) { Lip.start(tl, { pending: true }); setTimeout(() => Lip.begin(), 1600); }
    const voice = isTutor ? Tutor.char.claudeVoice : 'buttery';
    try {
      await t.speak(line.text, { voice, rate: clamp(rate, 0.7, 1.5), language: line.lang === 'es' ? 'es' : 'en' });
    } catch (e) {
      const code = e && e.code;
      if (code === 'not_granted' || code === 'unavailable') { this.claudeOff = true; this.configure(); App.updateStatus(); if (this.backend === 'browser') return this.browserLine(line, rate, isTutor, tl); }
      if (code === 'busy') { Ears.abort(); }
    }
  },
  async serverLine(line, rate, isTutor) {
    const r = await fetch('api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: line.text, lang: line.lang, voice: isTutor ? Tutor.char.id : 'npc', speed: rate }) });
    if (!r.ok) throw new Error('tts ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    await new Promise(res => {
      const a = new Audio(url); this.audio = a;
      let done = false; const finish = () => { if (done) return; done = true; this._resolveLine = null; URL.revokeObjectURL(url); res(); };
      this._resolveLine = finish;
      a.onended = finish; a.onerror = finish;
      try {
        this.unlock();
        if (this.ctx && isTutor) {
          const src = this.ctx.createMediaElementSource(a); const an = this.ctx.createAnalyser(); an.fftSize = 1024;
          src.connect(an); an.connect(this.ctx.destination); Lip.startAnalyser(an);
        }
      } catch (e) { }
      a.play().catch(finish);
    });
  }
};

/* ---------------- Oído (voz a texto) ---------------- */
const Ears = {
  backend: 'none', denied: false, rec: null, h: null, listening: false,
  configure() {
    const prev = this.backend;
    this._configure();
    if (prev !== this.backend) this.denied = false;
  },
  _configure() {
    if (Caps.claudeDictation && !this.claudeOff) {
      this.backend = 'claude';
      if (!this._hooked) {
        this._hooked = true; const d = Caps.claudeDictation;
        d.onPartial(({ text }) => this.h && this.h.partial(text));
        d.onFinal(({ text }) => this.h && this.h.final(text));
        d.onState(({ state, reason }) => { this.listening = state === 'listening'; this.h && this.h.state(state, reason); });
      }
    } else if ((window.SpeechRecognition || window.webkitSpeechRecognition) && window.isSecureContext !== false) this.backend = 'browser';
    else this.backend = 'none';
  },
  available() { return this.backend !== 'none' && !this.denied; },
  short() { return this.denied ? 'Mic sin permiso' : { claude: 'Dictado Claude', browser: 'Mic navegador', none: 'Sin mic' }[this.backend]; },
  label() {
    if (this.denied) return 'Micrófono sin permiso (respuestas escritas)';
    return { claude: 'Dictado de Claude', browser: 'Reconocimiento de voz del navegador', none: 'No disponible en este navegador (respuestas escritas)' }[this.backend];
  },
  // Debe llamarse directo desde el clic del usuario (sin await antes).
  start(h) {
    this.h = h;
    if (this.backend === 'claude') {
      this.listening = true;
      Caps.claudeDictation.start().catch(e => {
        const code = (e && (e.code || e.message)) || String(e);
        this.listening = false;
        if (code === 'not_granted') this.denied = true;
        h.error(code);
      });
      return;
    }
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new R(); this.rec = rec;
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = e => {
      let fin = '', part = '';
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript; else part += r[0].transcript; }
      if (part) h.partial(part);
      if (fin) h.final(fin);
    };
    rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') this.denied = true; h.error(e.error); };
    rec.onend = () => { this.listening = false; this.h && this.h.state('idle', 'ended'); };
    this.listening = true;
    try { rec.start(); } catch (e) { this.listening = false; h.error(String(e)); }
  },
  stop() {
    try { if (this.backend === 'claude') Caps.claudeDictation.stop(); else if (this.rec) this.rec.stop(); } catch (e) { }
  },
  abort() {
    this.h = null;
    if (this.listening) { try { if (this.backend === 'claude') Caps.claudeDictation.stop(); else if (this.rec) this.rec.abort(); } catch (e) { } }
    this.listening = false;
  }
};

/* ---------------- IA conversacional (opcional) ---------------- */
const AI = {
  mode: 'local', fails: 0, disabled: false,
  configure() { this.mode = Caps.server.chat ? 'server' : (Caps.claudeSample ? 'claude' : 'local'); },
  short() { return this.mode === 'local' || this.disabled ? 'Reglas locales' : (this.mode === 'server' ? 'IA API' : 'IA Claude'); },
  active() { return this.mode !== 'local' && !this.disabled && S.settings.useAI; },
  label() {
    if (this.mode === 'local') return 'Reglas locales (sin IA externa)';
    if (this.disabled) return 'IA no disponible ahora · usando reglas locales';
    return this.mode === 'server' ? 'IA vía servidor (API externa)' : 'IA de Claude';
  },
  async complete(prompt) {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000));
    const run = (async () => {
      if (this.mode === 'server') {
        const r = await fetch('api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt }) });
        if (!r.ok) throw new Error('chat ' + r.status);
        return (await r.json()).text;
      }
      const res = await Caps.claudeSample(prompt, { modelTier: 'quick', cache: false });
      return res.text;
    })();
    return Promise.race([run, timeout]);
  },
  async json(prompt) {
    try {
      const t = await this.complete(prompt);
      const m = String(t).match(/\{[\s\S]*\}/);
      const j = JSON.parse(m[0]);
      this.fails = 0;
      return j;
    } catch (e) {
      console.warn('IA', e);
      if (e && (e.code === 'not_granted')) this.disabled = true;
      if (++this.fails >= 2) this.disabled = true;
      App.updateStatus();
      return null;
    }
  }
};

function askAnswer(container, opts = {}) {
  return new Promise(resolve => {
    const micOK = Ears.available() && !opts.textOnly && !S.forceText;
    container.innerHTML = `
      <div class="answer">
        ${opts.label ? `<p class="ans-label">${opts.label}</p>` : ''}
        <div class="ans-live" aria-live="polite">${micOK ? 'Toca el micrófono cuando quieras responder.' : ''}</div>
        ${micOK ? `<button class="mic" type="button"><span class="mic-ico" aria-hidden="true"></span><span class="mic-lbl">Toca y habla</span></button>` : ''}
        <form class="ans-form" ${micOK ? 'hidden' : ''}>
          <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(opts.placeholder || 'Escribe tu respuesta en inglés…')}" aria-label="Tu respuesta">
          <button class="btn primary" type="submit">Enviar</button>
        </form>
        <div class="ans-tools">
          ${micOK ? '<button type="button" class="link" data-a="type">⌨️ Prefiero escribir</button>' : ''}
          ${opts.hint ? '<button type="button" class="link" data-a="hint">💡 Pista</button>' : ''}
          ${opts.allowHelp !== false ? '<button type="button" class="link" data-a="repeat">🐢 No entendí, repite lento</button>' : ''}
          ${opts.skip ? '<button type="button" class="link" data-a="skip">Saltar</button>' : ''}
        </div>
        <div class="ans-hint" hidden></div>
      </div>`;
    const live = $('.ans-live', container), mic = $('.mic', container), form = $('form', container), input = $('input', form);
    let finalText = '', partial = '', t0 = 0, tLast = 0, timer = 0, done = false;
    const setMic = on => { if (!mic) return; mic.classList.toggle('on', on); $('.mic-lbl', mic).textContent = on ? 'Te escucho… toca para terminar' : 'Toca y habla'; };
    const showText = () => { form.hidden = false; input.focus(); };
    const finish = r => { if (done) return; done = true; clearTimeout(timer); Ears.abort(); setMic(false); $('.answer', container).classList.add('done'); Tutor.mood('idle'); resolve(r); };
    const submitSpoken = () => {
      const text = (finalText || partial).trim();
      if (!text) { live.textContent = 'No te escuché. Toca el micrófono e intenta otra vez, o escribe tu respuesta.'; setMic(false); Tutor.mood('idle'); return; }
      const seconds = t0 ? Math.max(1, (tLast - t0) / 1000 + 0.6) : 1;
      live.innerHTML = `<span class="you">Tú:</span> ${esc(text)}`;
      finish({ text, viaMic: true, seconds });
    };
    if (mic) mic.addEventListener('click', () => {
      if (Ears.listening) { Ears.stop(); return; }
      Voice.stop(); Voice.unlock();
      finalText = ''; partial = ''; t0 = 0;
      setMic(true); Tutor.mood('listen'); live.textContent = 'Te escucho…';
      Ears.start({
        partial: t => { if (!t0) t0 = performance.now(); tLast = performance.now(); partial = t; live.innerHTML = `<span class="you">Tú:</span> ${esc((finalText + ' ' + t).trim())}…`; if (Ears.backend === 'claude') { clearTimeout(timer); timer = setTimeout(() => Ears.stop(), 2600); } },
        final: t => { if (!t0) t0 = performance.now(); tLast = performance.now(); finalText = (finalText + ' ' + t).trim(); partial = ''; live.innerHTML = `<span class="you">Tú:</span> ${esc(finalText)}`; if (Ears.backend === 'claude') { clearTimeout(timer); timer = setTimeout(() => Ears.stop(), 1300); } },
        state: (st, reason) => {
          if (st !== 'idle' || done) return;
          setMic(false);
          if (finalText || partial) submitSpoken();
          else { Tutor.mood('idle'); if (!Ears.denied) live.textContent = 'No te escuché. Toca el micrófono e intenta otra vez.'; }
        },
        error: code => {
          setMic(false); Tutor.mood('idle');
          if (Ears.denied) { live.textContent = 'No hay permiso para usar el micrófono. Responde por escrito.'; if (mic) mic.hidden = true; showText(); opts.onDenied && opts.onDenied(); }
          else if (code === 'no-speech') live.textContent = 'No te escuché. Intenta otra vez.';
          else if (code !== 'aborted') live.textContent = `El micrófono tuvo un problema (${code}). Intenta de nuevo o escribe tu respuesta.`;
        }
      });
    });
    form.addEventListener('submit', e => { e.preventDefault(); const t = input.value.trim(); if (!t) return; live.innerHTML = `<span class="you">Tú (escrito):</span> ${esc(t)}`; finish({ text: t, viaMic: false, seconds: 0 }); });
    $$('.ans-tools .link', container).forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'type') { showText(); b.hidden = true; }
      if (a === 'hint') { const h = $('.ans-hint', container); h.hidden = false; h.innerHTML = `💡 ${esc(opts.hint)}`; }
      if (a === 'repeat') finish({ cmd: 'repeat' });
      if (a === 'skip') finish({ cmd: 'skip', text: '' });
    }));
    if (!micOK) setTimeout(() => input.focus({ preventScroll: true }), 50);
  });
}

function diffHTML(cmp, label) {
  const pct = Math.round(cmp.ratio * 100);
  return `<div class="diff">
    <div class="diff-words">${cmp.words.map(w => `<span class="${w.ok ? 'ok' : 'miss'}">${esc(w.w)}</span>`).join(' ')}</div>
    <div class="meter"><span style="width:${pct}%"></span></div>
    <p class="fine">${label || 'Coincidencia con la frase'}: <b>${pct}%</b> · Se compara el texto reconocido, no la pronunciación.</p></div>`;
}

SCREENS.test = () => run(testFlow);

function pickItem(kind, T) {
  const bank = TEST_BANK[kind];
  const free = bank.filter(it => !T.used.has(it.id));
  free.sort((a, b) => Math.abs(a.d - T.d) - Math.abs(b.d - T.d) || b.d - a.d);
  const it = free[0]; T.used.add(it.id); return it;
}

async function testFlow() {
  const f = App.flow; setScene('studio');
  const T = { items: [], d: 2, start: Date.now(), used: new Set(), micMode: Ears.available(), intro: {} };
  S.forceText = false;
  view(`<div class="card test">
    <div class="test-head"><div><p class="eyebrow">Examen inicial</p><h1 id="tTitle">Preparación</h1></div>

    <div class="progress"><span id="tBar" style="width:0%"></span></div>
    <div id="tBody"></div></div>`);
  const timer = setInterval(() => {
    if (App.flow !== f) return clearInterval(timer);
    const s = Math.floor((Date.now() - T.start) / 1000); const el = $('#tTimer'); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);
  const body = html => { $('#tBody').innerHTML = html; };
  Tutor.mood('greet');
  await say(f, [es(`¡Hola${S.name ? ', ' + S.name : ''}! Antes de empezar el curso, vamos a estimar tu nivel. Son 10 actividades cortas, de 8 a 10 minutos: vas a escuchar, elegir respuestas y platicar conmigo.`)]);

  // Prueba de micrófono
  if (Ears.available()) {
    body(`<h2>Prueba tu micrófono</h2><p>Toca el micrófono y di: <b class="say">"Hello, I'm ready!"</b></p><div id="ans"></div>
      <button class="link" id="noMic">No puedo usar el micrófono ahora · responder por escrito</button>`);
    let noMic; const noMicP = new Promise(r => { noMic = r; });
    $('#noMic').addEventListener('click', () => noMic({ cmd: 'nomic' }));
    await say(f, [es('Primero probemos tu micrófono. Toca el botón y dime:'), en("Hello, I'm ready!")]);
    let r;
    for (; ;) {
      r = await Promise.race([askAnswer($('#ans'), { allowHelp: false, onDenied: () => noMic({ cmd: 'nomic' }) }), noMicP]);
      App.check(f);
      if (r.cmd === 'nomic' || Ears.denied || !r.viaMic) break;
      if (r.viaMic) break;
    }
    if (r.cmd === 'nomic' || Ears.denied || !r.viaMic) {
      T.micMode = false; S.forceText = true;
      await say(f, [es('Sin problema. Responderás por escrito y la expresión oral quedará como «sin evaluar».')]);
    } else {
      addSpoken(r.seconds); Tutor.mood('celebrate');
      await say(f, [en("Great, I can hear you! Let's start.")]);
    }
  } else {
    T.micMode = false;
    body(`<div class="notice">🎤 Tu navegador no permite reconocimiento de voz aquí. Responderás por escrito y la <b>expresión oral quedará «sin evaluar»</b>.<br><small>Para hablar con el tutor, abre la app en Chrome o Edge y permite el micrófono.</small></div>
      <button class="btn primary" id="go">Continuar</button>`);

    if (kind !== 'C') T.d = clamp(T.d + (res.score >= 0.6 ? 1 : -1), 1, 5);
  }
  $('#tBar').style.width = '100%';

async function testConversation(f, T, body) {
  $('#tTitle').textContent = 'Conversación breve';
  body(`<p class="skill-chip">💬 Plática con ${esc(Tutor.char.name)}</p><div class="chat" id="chat"></div><div id="ans"></div>`);
  await say(f, [es('Última actividad: una plática corta conmigo. Respóndeme con naturalidad.')]);
  const levelIdx = T.d - 1;
  const dlg = new FreeDialog('intro', { levelIdx, userName: S.name }, 99);
  let q = dlg.opening();
  const history = [], scores = [], tags = [];
  let mic = 0, turns = 0;
  while (turns < 3) {
    addChat('tutor', q); history.push({ role: 'tutor', text: q });
    await say(f, [en(q)]);
    let r;
    for (; ;) { r = await askAnswer($('#ans'), {}); App.check(f); if (r.cmd === 'repeat') { await say(f, [en(q)], { slow: true }); continue; } break; }
    addChat('user', r.text); history.push({ role: 'user', text: r.text });
    if (r.viaMic) { mic++; addSpoken(r.seconds); }
    const sc = scoreOpen(r.text, { minWords: [4, 6, 9, 12, 15][levelIdx] });
    scores.push(sc.score); if (sc.corrections) tags.push(...sc.corrections.tags);
    turns++;
    if (turns >= 3) break;
    const local = dlg.respond(r.text);
    q = local.reply;
    if (AI.active() && !local.help) {
      Tutor.mood('think');
      const j = await AI.json(promptConversation({ tutorName: Tutor.char.name, level: LEVELS[levelIdx], scenario: 'A short, friendly getting-to-know-you chat in a placement test. Ask about the student\'s life, free time and reasons to learn English.', role: 'a friendly English tutor', history, said: r.text, turn: turns + 1, maxTurns: 3 }));
      App.check(f); Tutor.mood('idle');
      if (j && j.reply) q = j.reply;
    }
  }
  const bye = "Thanks for chatting with me! That's the end of the test.";
  addChat('tutor', bye); Tutor.mood('celebrate');
  await say(f, [en(bye)]);
  const score = scores.reduce((a, b) => a + b, 0) / scores.length;
  return { kind: 'C', skill: 'C', d: T.d, score, viaMic: mic > 0, written: mic === 0, tags };
}

function computeResult(T) {
  const items = T.items;
  const est = items.reduce((a, it) => a + (it.d - 0.5 + it.score), 0) / items.length;
  const levelIdx = clamp(Math.round(est) - 1, 0, 4);
  const groups = {};
  items.forEach(it => { (groups[it.skill] = groups[it.skill] || []).push(it); });
  const skills = {};
  Object.entries(groups).forEach(([k, arr]) => {
    const avg = arr.reduce((a, it) => a + it.score, 0) / arr.length;
    const lv = arr.reduce((a, it) => a + (it.d - 0.5 + it.score), 0) / arr.length;
    skills[k] = { pct: Math.round(avg * 100), level: LEVELS[clamp(Math.round(lv) - 1, 0, 4)], n: arr.length };
  });
  const speakingEvaluated = !!skills.S;
  const convWritten = items.find(i => i.kind === 'C')?.written;
  const STRONG = { L: 'Entiendes bien el inglés hablado en situaciones reales.', V: 'Reconoces el vocabulario correcto según el contexto.', S: 'Te animas a responder en voz alta con frases completas.', C: 'Sostienes una plática respondiendo a lo que te preguntan.', W: 'Te expresas con claridad por escrito.' };
  const WEAK = { L: 'Comprensión auditiva: escucha audios cortos varias veces antes de leer el texto.', V: 'Vocabulario: aprende frases completas, no palabras sueltas.', S: 'Expresión oral: responde con frases más completas (sujeto + verbo + un detalle).', C: 'Conversación: después de responder, agrega un detalle o una razón ("because…").', W: 'Respuestas escritas: cuida el orden sujeto-verbo y los tiempos verbales.' };
  const sorted = Object.entries(skills).sort((a, b) => b[1].pct - a[1].pct);
  let strengths = sorted.filter(([, v]) => v.pct >= 70).map(([k]) => STRONG[k]);
  if (!strengths.length && sorted.length) strengths = [`Tu mejor resultado fue en ${SKILL_LABELS[sorted[0][0]].toLowerCase()} (${sorted[0][1].pct}%). ¡Ahí hay una buena base!`];
  const improvements = sorted.filter(([, v]) => v.pct < 60).reverse().map(([k]) => WEAK[k]);
  const tags = [...new Set(items.flatMap(i => i.tags || []))].slice(0, 3);
  tags.forEach(t => improvements.push(`Practicar: ${t}.`));
  if (!improvements.length) improvements.push('Ganar fluidez: responde más rápido y con más detalle en conversaciones largas.');
  if (!speakingEvaluated) improvements.push('Expresión oral: sin evaluar. Cuando puedas, usa el micrófono para medirla.');
  return {
    date: new Date().toISOString(), levelIdx, level: LEVELS[levelIdx], est: Math.round(est * 100) / 100,
    skills, speakingEvaluated, convWritten, strengths, improvements,
    recommended: recommendLesson(levelIdx, S.goal).id, minutes: Math.max(1, Math.round((Date.now() - T.start) / 60000))
  };
}

function lessonRank(l, levelIdx, goal) {
  return Math.abs(l.level - (levelIdx + 1)) + (goal && !l.goals.includes(goal) ? 2.5 : 0) + (S.completed[l.id] ? 6 : 0) + l.level * 0.01;
}
function recommendLesson(levelIdx = 0, goal = null) {
  return LESSONS.slice().sort((a, b) => lessonRank(a, levelIdx, goal) - lessonRank(b, levelIdx, goal))[0];
}

function skillBars(R) {
  const order = ['L', 'V', 'S', 'C', 'W'];
  return order.map(k => {
    if (k === 'S' && !R.skills.S) return `<div class="skill"><div class="skill-top"><span>${SKILL_LABELS.S}</span><b class="na">Sin evaluar</b></div><div class="meter na"><span style="width:0"></span></div></div>`;
    const s = R.skills[k]; if (!s) return '';
    const label = k === 'C' && R.convWritten ? SKILL_LABELS.C + ' (escrita)' : SKILL_LABELS[k];
    return `<div class="skill"><div class="skill-top"><span>${label}</span><b>${s.pct}% · ≈${s.level}</b></div><div class="meter"><span style="width:${s.pct}%"></span></div></div>`;
  }).join('');
}
